name: isaret_dili_cevirici
description: "Canlı İşaret Dili Çeviri Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Birbiriyle ve güncel Flutter ile tam uyumlu asil versiyonlar
  camera: ^0.10.5+9
  onnxruntime: ^1.4.1     # Hatanın kalbini bu güncel sürümle çözüyoruz
  path_provider: ^2.1.3
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/kelime.onnx